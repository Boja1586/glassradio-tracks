<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlassRadio — сборник</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1c1034;
    color: #ece6ff;
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header {
    background: linear-gradient(135deg, #46238c, #7a4fe0);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: 0 6px 24px rgba(0,0,0,.4);
  }
  header h1 { font-size: 24px; }
  header p { opacity: .8; font-size: 13px; margin-top: 4px; }
  #stats { font-size: 13px; color: #c4a4ff; margin: 10px 2px; }
  .searchrow { display: flex; gap: 8px; }
  .searchrow #search { flex: 1; width: auto; }
  #search { flex: 1; }
  #random {
    flex-shrink: 0;
    background: #8264e6;
    border: 0;
    border-radius: 10px;
    color: #fff;
    font-weight: bold;
    font-size: 13px;
    padding: 0 16px;
    cursor: pointer;
  }
  #random:hover { background: #9375f5; }
  .row.flash { outline: 2px solid #e0b3ff; }
  #search {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #6a4fc0;
    background: #140c28;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  #search:focus { border-color: #a37fff; }
  #list { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #37236a;
    border-radius: 9px;
    padding: 9px 10px;
  }
  .row .t {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
  }
  .row .t small { color: #b9a3ee; }
  .row button {
    flex-shrink: 0;
    background: #8264e6;
    border: 0;
    border-radius: 7px;
    color: #fff;
    font-size: 12px;
    font-weight: bold;
    padding: 7px 12px;
    cursor: pointer;
  }
  .row button:hover { background: #9375f5; }
  #pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
  }
  #pager button {
    background: #8264e6;
    border: 0;
    border-radius: 8px;
    color: #fff;
    font-weight: bold;
    padding: 8px 18px;
    cursor: pointer;
  }
  #pager button:disabled { opacity: .35; cursor: default; }
  #pager span { font-size: 13px; color: #c4a4ff; }
  footer { text-align: center; margin-top: 26px; font-size: 12px; color: #8d7bb8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GlassRadio — сборник</h1>
    <p>Коды музыки Roblox. Нажми «Код» — скопируется, вставь в игру.</p>
  </header>
  <div class="searchrow">
    <input id="search" type="text" placeholder="Поиск по названию или коду..." autocomplete="off">
    <button id="random">Рандом</button>
  </div>
  <div id="stats">Загрузка...</div>
  <div id="list"></div>
  <div id="pager">
    <button id="prev">Назад</button>
    <span id="page"></span>
    <button id="next">Далее</button>
  </div>
  <footer>обновляется автоматически</footer>
</div>
<script>
const PER = 20;
let all = [], view = [], page = 1, flashId = null;
const $ = id => document.getElementById(id);

function render() {
  const pages = Math.max(1, Math.ceil(view.length / PER));
  page = Math.min(Math.max(1, page), pages);
  const s = (page - 1) * PER;
  const slice = view.slice(s, s + PER);
  $("list").innerHTML = "";
  for (const t of slice) {
    const row = document.createElement("div");
    row.className = "row" + ((flashId && t.id === flashId) ? " flash" : "");
    const name = document.createElement("div");
    name.className = "t";
    name.textContent = t.name;
    const code = document.createElement("small");
    code.textContent = " — " + t.id;
    name.appendChild(code);
    const btn = document.createElement("button");
    btn.textContent = "Код";
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(t.id); }
      catch (e) {
        const ta = document.createElement("textarea");
        ta.value = t.id; document.body.appendChild(ta);
        ta.select(); document.execCommand("copy"); ta.remove();
      }
      btn.textContent = "Ок!";
      setTimeout(() => btn.textContent = "Код", 1200);
    };
    row.appendChild(name);
    row.appendChild(btn);
    $("list").appendChild(row);
  }
  $("stats").textContent = `Треков: ${view.length} из ${all.length}`;
  $("page").textContent = `${page} / ${pages}`;
  $("prev").disabled = page <= 1;
  $("next").disabled = page >= pages;
}

function applyFilter() {
  const q = $("search").value.trim().toLowerCase();
  view = q ? all.filter(t =>
    (t.name + " " + t.id).toLowerCase().includes(q)) : all.slice();
  page = 1;
  render();
}

$("search").addEventListener("input", applyFilter);
$("prev").onclick = () => { if (page > 1) { page--; render(); } };
$("next").onclick = () => {
  if (page < Math.ceil(view.length / PER)) { page++; render(); }
};
$("random").onclick = async () => {
  if (!view.length) return;
  const pick = view[Math.floor(Math.random() * view.length)];
  page = Math.floor(view.indexOf(pick) / PER) + 1;
  flashId = pick.id;
  render();
  try { await navigator.clipboard.writeText(pick.id); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = pick.id; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }
  $("stats").textContent = `Рандом: ${pick.name} — код скопирован, вставь в игру`;
  setTimeout(() => { flashId = null; render(); }, 2500);
};

fetch("./AllTracks.json")
  .then(r => r.json())
  .then(d => {
    all = Array.isArray(d) ? d : [];
    view = all.slice();
    render();
  })
  .catch(() => { $("stats").textContent = "Не загрузилось."; });
</script>
</body>
</html>
